# ──────────────────────────────────────────────
#  snap.cfg  —  konfiguracja snap.py
# ──────────────────────────────────────────────

[performance]

# Liczba równoległych workerów (kart przeglądarki).
# Zalecenia sprzętowe:
#   4 GB  RAM  →  workers = 1
#   8 GB  RAM  →  workers = 2-3   (OptiPlex 790 / podobne)
#   16 GB RAM  →  workers = 4-6
#   32 GB RAM  →  workers = 8+
workers = 3


[browser]

# Rozdzielczość wirtualnego okna przeglądarki
# 1920x1080 = najpopularniejszy monitor (Full HD), 1440x900 = mniejszy laptop
viewport_width  = 1920
viewport_height = 1080

# Gęstość pikseli: 1 = zwykły monitor, 1.25 = typowy laptop z Windows
# (skalowanie 125%), 2 = Retina/ostrzejszy screen (plik 4x większy)
device_scale_factor = 1

# Maksymalna wysokość screenshota w pikselach (zabezpieczenie przed bardzo długimi LP)
max_screenshot_height = 30000


[crawl]

# Maksymalna liczba podstron wykrytych automatycznie w trybie crawl
max_pages = 9999
